# Push a tag like v0.4.0 and GitHub builds SalusNovus-<version>.zip from the
# addon folder and publishes it as a Release, so the Releases page always
# holds the current build. Nothing to upload by hand.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the addon zip
        run: python make_release.py
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SalusNovus-*.zip
          generate_release_notes: true
